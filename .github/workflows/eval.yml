name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate case set
        run: python -m qaeval validate --config configs/baseline.yaml

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Offline evaluation (mock model)
        run: python -m qaeval run --config configs/baseline.yaml

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/baseline/
